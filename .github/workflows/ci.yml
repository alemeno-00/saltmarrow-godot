name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests
        run: ./godot --headless --path . -s tests/run_tests.gd

  web:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Install Godot and web templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && chmod +x godot
          curl -sL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          D=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$D" && unzip -q -j tpl.tpz 'templates/web_*' 'templates/version.txt' -d "$D" && rm tpl.tpz
      - name: Export web build
        run: |
          ./godot --headless --path . --import || true
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
